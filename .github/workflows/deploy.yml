
name: Test and Deploy

on:
  push:
    branches: [dev]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.8
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run
        env:
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRATION: 900
          JWT_REFRESH_EXPIRATION: 604800

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy through SSM
        run: |
          INSTANCE_ID="i-0459ae1b93737b5b1"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --parameters '{"commands":["sudo -iu ec2-user bash -lc \"set -e; cd /home/ec2-user/knitting-library-backend && git pull origin dev && npm ci && npm run migrate:prod && pm2 restart knitting-backend\""]}' \
            --query "Command.CommandId" \
            --output text)
          echo "SSM command ID: $COMMAND_ID"

          STATUS="Pending"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

          [ "$STATUS" = "Success" ] 
